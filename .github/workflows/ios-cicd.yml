name: iOS CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - lib/**
      - ios/**
      - pubspec.yaml
      - .github/workflows/ios-cicd.yml

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.ta.myhiking

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install iOS pods
        working-directory: ios
        run: pod install --repo-update

      - name: Install Apple signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing APPLE_SIGNING_CERTIFICATE_BASE64 secret}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_SIGNING_CERTIFICATE_PASSWORD secret}"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="temp-keychain-password"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing_certificate.p12"
          security import "$RUNNER_TEMP/signing_certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          : "${PROVISIONING_PROFILE_BASE64:?Missing APPLE_PROVISIONING_PROFILE_BASE64 secret}"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Create export options
        run: |
          : "${TEAM_ID:?Missing APPLE_TEAM_ID secret}"

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        run: flutter build ipa --release --dart-define=GOOGLE_CLIENT_ID=861064220732-vcikg3u9lb7l1ub4it3i902nt599lh7n.apps.googleusercontent.com --export-options-plist=ios/ExportOptions.plist

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: myhiking-ios-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
