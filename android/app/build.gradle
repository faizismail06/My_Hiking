plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin harus diterapkan setelah plugin Android dan Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ta.myhiking" // Pastikan namespace sesuai dengan struktur package Anda.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Pastikan applicationId ini unik untuk aplikasi Anda.
        applicationId = "com.ta.myhiking"
        // Versi minimum dan target SDK aplikasi Anda.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // Konfigurasi penandatanganan (signing) untuk build release.
            signingConfig = signingConfigs.debug
            // Optimasi build release.
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
