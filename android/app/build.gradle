plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin harus diterapkan setelah plugin Android dan Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.myhiking" // Pastikan namespace sesuai dengan struktur package Anda.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        // Pastikan applicationId ini unik untuk aplikasi Anda.
        applicationId = "com.example.myhiking"
        // Versi minimum dan target SDK aplikasi Anda.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // Konfigurasi penandatanganan (signing) untuk build release.
            signingConfig = signingConfigs.debug
            // Optimasi build release.
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}
